[project]
name = "fyp-mimo-analysis"
version = "0.1.0"
description = "Post-processing for CST exports of the UWB 4-port MIMO antenna with AMC metasurface"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-rf>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
